<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <tr>
            <th>Speaker </th>
            <th>Title </th>
            <th>Location </th>
            <th>Year </th>
          </tr>
          <tr id="lookatme">
            <td id="one">Elder Clark G. & Sister Christine C. Gilbert</td>
            <td id="two">Finding the Savior in the Proclamation</td>
            <td id="three">BYU-Idaho</td>
            <td id="four">2025</td>
          </tr>
          <tr id="lookatme">
            <td id="one">President Dallin H. Oaks</td>
            <td id="two">Coming Closer to Jesus Christ</td>
            <td id="three">BYU Provo</td>
            <td id="four">2026</td>
          </tr>
          <tr id="lookatme">
            <td id="one">President Alvin F. Meredith III</td>
            <td id="two">The Mission of BYU-Idaho</td>
            <td id="three">BYU-Idaho</td>
            <td id="four">2026</td>
          </tr>
        </table>

        <form>
          <label for="Speaker">Speaker: </label>
          <input type="text" id="Speaker" required>

           <label for="Title">Title: </label>
          <input type="text" id="Title">

          <label for="Location">Location: </label>
          <input type="text" id="Location">

          <label for="Year">Year: </label>
          <input type="text" id="Year">

          <input id="submitbutton" type="submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
