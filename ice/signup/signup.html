<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        #box {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            align-items: center;
            height: 700px;
            width: 500px;
            background-color: white;
            border-radius: 3%;
            border: solid 10px navy;
            overflow: hidden;
        }

        #formContainer {
            grid-row: 2/3;
            display: grid;
            grid-template-rows: 21px 21px 21px 21px 21px;
        }

        #h3 {
            grid-row: 1/2;
            text-align: center;
        }
        * {
            margin: 0;
        }

        body {
            align-items: center;
            background: rgb(120, 96, 64);
        }
        #Jesus {
            margin-top: 0;
            height: 200px;
            width: 100px;
            object-fit: cover;
        }
    </style>




</head>

<body>
    <div id="box">
        <div id="formContainer">
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm">
                <button type="button" id="closeBtn">X</button>
                <label for="username">User Name:</label>                
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label>Gender:</label>
                    <div>
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female" required>
                        <label for="female">Female</label>
                    </div>

                    <section>
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Subscribe to newsletter</label>
                    </section>

                    <section>
                        <input type="checkbox" id="conditions" name="conditions" required>
                        <label for="conditions">I acknowledge the terms and conditions</label>
                    </section>

                    <section>
                        <button type="submit">Submit</button>
                    </section>
            </form>
            <img id ="Jesus"src="/images/jesus_feeds_5000.jpeg">
        </div>
    </div>
    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
